name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rebuzz
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The suite forces WHATSAPP_PROVIDER=mock and runs Celery inline, so CI
      # needs no Redis and — importantly — no Meta credentials.
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rebuzz
      DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Django system checks
        run: python manage.py check

      - name: Missing migrations
        # A model change without its migration breaks deploys, not tests, so
        # it has to be caught here.
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  deploy-check:
    name: Production settings check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/prod.txt

      - name: Check production settings
        # Catches a missing security setting before it reaches a server.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-placeholder-0d8f3a91c47b26e5af10bd93c6e284f7a5b1e0c9d3728f46
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/placeholder
          ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
        run: python manage.py check --deploy --fail-level WARNING
