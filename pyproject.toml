[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "migrations", "staticfiles", "media"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ", "S"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function calls in argument defaults (common in DRF)
    "S101",   # asserts are expected in tests
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S105", "S106", "S107"]  # hardcoded test passwords and tokens are fine
"config/settings/*" = ["F403", "F405", "S105"]  # test settings hold placeholder, non-secret values
"conftest.py" = ["S105", "S106", "S107"]
# Demonstration data. The randomness shapes a plausible send history; nothing
# here is a token, a key or an identifier anyone relies on being unguessable.
"core/management/commands/seed_demo.py" = ["S311"]
# The simulated payment provider. Its randomness picks which fake decline to
# return so the retry path can be exercised locally; nothing it generates is a
# token, a key, or anything anyone relies on being unguessable.
"billing/providers/mock_provider.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "billing", "campaigns", "config", "contacts", "core", "dashboard", "messaging", "organizations", "pages", "whatsapp"]

[tool.coverage.run]
source = ["accounts", "billing", "campaigns", "contacts", "core", "dashboard", "messaging", "organizations", "pages", "whatsapp"]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "config/wsgi.py", "config/asgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
