[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py *_test.py
norecursedirs = .venv venv node_modules staticfiles media .git .ruff_cache __pycache__
addopts =
    --strict-markers
    --reuse-db
    -ra
markers =
    integration: talks to an external service; excluded from the default run
filterwarnings =
    # Unordered pagination lets the same row appear on two pages. Never a warning.
    error::django.core.paginator.UnorderedObjectListWarning
