# =============================================================================
# ReachBuzz — Render Blueprint
#
# Creates everything the application needs in one go: the web service, one
# Celery worker (which also runs the beat scheduler), PostgreSQL, and Redis.
# Render → New → Blueprint → pick this repository.
#
# Secrets are never written here. SECRET_KEY, FIELD_ENCRYPTION_KEY and
# PAYMENT_WEBHOOK_SECRET are generated by Render once, on creation. Email and
# Meta credentials are added to the "reachbuzz-shared" environment group in the
# dashboard; a Blueprint sync keeps variables it does not define.
#
# Everything sits in Singapore, the closest region to Nepal, and in one region
# so the services reach the database and Redis over Render's private network.
# =============================================================================

services:
  # --- Web ---------------------------------------------------------------------
  - type: web
    name: reachbuzz
    runtime: python
    region: singapore
    plan: starter
    branch: main
    autoDeployTrigger: commit
    # requirements/prod.txt, not the root requirements.txt: the root file
    # installs the development tools and has no gunicorn.
    buildCommand: pip install -r requirements/prod.txt && python manage.py collectstatic --noinput
    # Runs once per deploy, before the new version takes traffic.
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    # No healthCheckPath on purpose. Render probes the instance directly, and
    # production settings answer that probe with a 400 (unknown Host) or a 301
    # (not HTTPS), so a path check would fail every deploy. Render falls back to
    # checking that the port is open.
    envVars:
      - fromGroup: reachbuzz-shared
      - key: DATABASE_URL
        fromDatabase:
          name: reachbuzz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachbuzz-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: reachbuzz-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: reachbuzz-redis
          property: connectionString

  # --- Celery worker + beat ----------------------------------------------------
  # -B runs the beat scheduler inside this worker, which saves a service. That
  # is only correct while there is exactly one worker: two would each run the
  # schedule and launch every due campaign twice. Before scaling out, move beat
  # to its own worker service running `celery -A config beat -l info`.
  - type: worker
    name: reachbuzz-worker
    runtime: python
    region: singapore
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements/prod.txt
    # --concurrency caps the process count. Left alone, Celery starts one per
    # CPU the host reports, which is far more than 512 MB holds.
    startCommand: celery -A config worker -B -l info -Q default,whatsapp_send,whatsapp_webhook --concurrency 2
    envVars:
      - fromGroup: reachbuzz-shared
      - key: DATABASE_URL
        fromDatabase:
          name: reachbuzz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachbuzz-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: reachbuzz-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: reachbuzz-redis
          property: connectionString

  # --- Redis -------------------------------------------------------------------
  - type: keyvalue
    name: reachbuzz-redis
    region: singapore
    plan: starter
    # Internal connections only.
    ipAllowList: []
    # Redis is the Celery broker. The default policy evicts keys when memory
    # fills, which would silently drop queued sends; this refuses writes instead.
    maxmemoryPolicy: noeviction

databases:
  - name: reachbuzz-db
    region: singapore
    plan: basic-256mb
    databaseName: reachbuzz
    user: reachbuzz
    # Matches the version CI tests against.
    postgresMajorVersion: "16"

envVarGroups:
  - name: reachbuzz-shared
    envVars:
      # Without this, manage.py and config/celery.py both fall back to
      # config.settings.local.
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      # Must match the service's URL. If Render gives the web service a
      # different address (the name was taken), or a custom domain is added,
      # change both of these here: a sync overwrites dashboard edits to them.
      - key: ALLOWED_HOSTS
        value: reachbuzz.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://reachbuzz.onrender.com

      # Generated once, when the Blueprint is created, and never again. The web
      # service and the worker must share them: the worker signs links in the
      # emails it sends and decrypts the tokens the web service stored.
      #
      # check --deploy reports security.W009 for SECRET_KEY: Render generates
      # 44 characters and Django's heuristic wants 50. It is 256 random bits,
      # which is full strength for the HMAC-SHA256 Django signs with.
      - key: SECRET_KEY
        generateValue: true
      # Copy this one out of the dashboard into a password manager. Losing or
      # changing it makes every stored WhatsApp token permanently unreadable.
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      # Left empty, the mock payment provider verifies webhooks with a fixed
      # secret that is in this repository, so anyone could forge one.
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true

      # Nothing real is sent until the Meta checklist (README §22, §35) passes.
      - key: WHATSAPP_PROVIDER
        value: mock

      # Add these in the dashboard (Environment Groups → reachbuzz-shared).
      # Until they exist, sign-up and notification emails fail and are logged;
      # nothing else breaks.
      #   EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD, DEFAULT_FROM_EMAIL
      #
      # And, when going live on WhatsApp:
      #   WHATSAPP_PROVIDER=meta (change the value above, not in the dashboard)
      #   META_API_VERSION, META_ACCESS_TOKEN, META_PHONE_NUMBER_ID,
      #   META_WABA_ID, META_APP_ID, META_APP_SECRET, META_WEBHOOK_VERIFY_TOKEN
