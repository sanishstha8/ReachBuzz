{% extends "base.html" %}

{% block body_class %}auth-shell{% endblock %}

{% block layout %}
<main id="main-content" class="auth-wrapper">
  <section class="auth-card" aria-labelledby="heading">
    <div class="auth-card__brand">
      <i class="bi bi-whatsapp" aria-hidden="true"></i>
      <span>{{ brand_name }}</span>
    </div>

    <h1 id="heading" class="h4 mb-1">Password changed</h1>
    <p class="text-body-secondary mb-4">You can sign in with your new password now.</p>

    <a class="btn btn-primary btn-lg w-100" href="{% url 'accounts:login' %}">Sign in</a>
  </section>
</main>
{% endblock layout %}
